<po-page-default #dynamicTable
p-title="Tabelas de Preço">

<po-table
[p-height]="tableHeight"
[p-columns]="columns"
[p-items]="items"
[p-actions]="tableActions"
[p-hide-columns-manager]="true"
p-container="border"
[p-striped]="true"
[p-actions-right]="true">

</po-table>

</po-page-default>
<po-loading-overlay [hidden]="isHideLoading"></po-loading-overlay>
